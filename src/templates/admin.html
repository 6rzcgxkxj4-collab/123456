<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 面部识别自动签到系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container admin-container">
        <header>
            <a href="{{ url_for('index') }}" class="back-link">← 返回首页</a>
            <h1>⚙️ 管理后台</h1>
        </header>
        
        <!-- Login Section -->
        <div id="loginSection" class="section">
            <h2>🔐 管理员登录</h2>
            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="employeeId">员工ID</label>
                    <input type="text" id="employeeId" name="employee_id" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
            <div id="loginError" class="error-message" style="display: none;"></div>
        </div>
        
        <!-- Admin Dashboard (hidden until login) -->
        <div id="adminDashboard" style="display: none;">
            <div class="admin-header">
                <span id="currentUser"></span>
                <button id="logoutBtn" class="btn btn-secondary">退出登录</button>
            </div>
            
            <nav class="admin-nav">
                <button class="tab-btn active" data-tab="statistics">📊 统计概览</button>
                <button class="tab-btn" data-tab="users">👥 用户管理</button>
                <button class="tab-btn" data-tab="records">📋 签到记录</button>
            </nav>
            
            <!-- Statistics Tab -->
            <div id="statisticsTab" class="tab-content active">
                <h3>今日签到统计</h3>
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-value" id="totalCheckins">-</span>
                        <span class="stat-label">今日签到次数</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="uniqueUsers">-</span>
                        <span class="stat-label">签到人数</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="totalUsers">-</span>
                        <span class="stat-label">总用户数</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="attendanceRate">-</span>
                        <span class="stat-label">出勤率</span>
                    </div>
                </div>
            </div>
            
            <!-- Users Tab -->
            <div id="usersTab" class="tab-content">
                <div class="tab-header">
                    <h3>用户管理</h3>
                    <button id="addUserBtn" class="btn btn-success">➕ 添加用户</button>
                </div>
                <div class="search-bar">
                    <input type="text" id="userSearch" placeholder="搜索用户...">
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>员工ID</th>
                            <th>姓名</th>
                            <th>部门</th>
                            <th>人脸注册</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    </tbody>
                </table>
                <div id="usersPagination" class="pagination"></div>
            </div>
            
            <!-- Records Tab -->
            <div id="recordsTab" class="tab-content">
                <h3>签到记录</h3>
                <div class="filter-bar">
                    <input type="date" id="dateFrom" placeholder="开始日期">
                    <input type="date" id="dateTo" placeholder="结束日期">
                    <button id="filterRecordsBtn" class="btn btn-primary">筛选</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>员工ID</th>
                            <th>姓名</th>
                            <th>签到方式</th>
                            <th>置信度</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody">
                    </tbody>
                </table>
                <div id="recordsPagination" class="pagination"></div>
            </div>
        </div>
        
        <!-- User Modal -->
        <div id="userModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h3 id="modalTitle">添加用户</h3>
                <form id="userForm" class="form">
                    <input type="hidden" id="userId" name="user_id">
                    <div class="form-group">
                        <label for="userEmployeeId">员工ID *</label>
                        <input type="text" id="userEmployeeId" name="employee_id" required>
                    </div>
                    <div class="form-group">
                        <label for="userName">姓名 *</label>
                        <input type="text" id="userName" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="userEmail">邮箱</label>
                        <input type="email" id="userEmail" name="email">
                    </div>
                    <div class="form-group">
                        <label for="userDepartment">部门</label>
                        <input type="text" id="userDepartment" name="department">
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="userIsAdmin" name="is_admin">
                            管理员权限
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary">保存</button>
                </form>
            </div>
        </div>
        
        <!-- Face Registration Modal -->
        <div id="faceModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h3>人脸注册</h3>
                <p id="faceModalUser"></p>
                <div class="video-container small">
                    <video id="faceVideo" autoplay playsinline></video>
                    <canvas id="faceCanvas" style="display: none;"></canvas>
                </div>
                <div class="modal-controls">
                    <button id="startFaceCamera" class="btn btn-primary">启动摄像头</button>
                    <button id="captureFaceBtn" class="btn btn-success" disabled>拍照注册</button>
                </div>
                <div class="upload-section">
                    <input type="file" id="faceImageUpload" accept="image/*" class="file-input">
                    <label for="faceImageUpload" class="file-label">选择图片</label>
                    <button id="uploadFaceBtn" class="btn btn-primary" disabled>上传注册</button>
                </div>
            </div>
        </div>
        
        <footer>
            <p>&copy; 2024 面部识别自动签到系统</p>
        </footer>
    </div>
    
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
