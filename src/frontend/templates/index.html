<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脸识别签到系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-user-check me-2"></i>
                人脸识别签到系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" data-page="attendance">
                            <i class="fas fa-camera me-1"></i>签到/签退
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-page="register">
                            <i class="fas fa-user-plus me-1"></i>用户注册
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-page="records">
                            <i class="fas fa-list me-1"></i>考勤记录
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-page="users">
                            <i class="fas fa-users me-1"></i>用户管理
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <!-- Attendance Page -->
        <div id="attendance-page" class="page active">
            <div class="row">
                <div class="col-md-8 mx-auto">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0"><i class="fas fa-camera me-2"></i>人脸签到/签退</h4>
                        </div>
                        <div class="card-body text-center">
                            <div id="video-container" class="mb-3">
                                <video id="video" width="640" height="480" autoplay></video>
                                <canvas id="canvas" width="640" height="480" style="display: none;"></canvas>
                            </div>
                            <div class="btn-group mb-3">
                                <button id="check-in-btn" class="btn btn-success btn-lg">
                                    <i class="fas fa-sign-in-alt me-2"></i>签到
                                </button>
                                <button id="check-out-btn" class="btn btn-danger btn-lg">
                                    <i class="fas fa-sign-out-alt me-2"></i>签退
                                </button>
                            </div>
                            <div id="attendance-result" class="alert d-none"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- User Registration Page -->
        <div id="register-page" class="page">
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-success text-white">
                            <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>用户信息</h4>
                        </div>
                        <div class="card-body">
                            <form id="register-form">
                                <div class="mb-3">
                                    <label for="employee_id" class="form-label">员工ID *</label>
                                    <input type="text" class="form-control" id="employee_id" required>
                                </div>
                                <div class="mb-3">
                                    <label for="name" class="form-label">姓名 *</label>
                                    <input type="text" class="form-control" id="name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">邮箱</label>
                                    <input type="email" class="form-control" id="email">
                                </div>
                                <div class="mb-3">
                                    <label for="department" class="form-label">部门</label>
                                    <input type="text" class="form-control" id="department">
                                </div>
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-save me-2"></i>保存用户信息
                                </button>
                            </form>
                            <div id="register-user-result" class="alert mt-3 d-none"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-info text-white">
                            <h4 class="mb-0"><i class="fas fa-camera me-2"></i>人脸采集</h4>
                        </div>
                        <div class="card-body text-center">
                            <div id="register-video-container" class="mb-3">
                                <video id="register-video" width="320" height="240" autoplay></video>
                                <canvas id="register-canvas" width="320" height="240" style="display: none;"></canvas>
                            </div>
                            <div class="mb-3">
                                <label for="user-select" class="form-label">选择用户</label>
                                <select class="form-select" id="user-select">
                                    <option value="">-- 请选择用户 --</option>
                                </select>
                            </div>
                            <button id="capture-face-btn" class="btn btn-info">
                                <i class="fas fa-camera me-2"></i>采集人脸
                            </button>
                            <div id="register-face-result" class="alert mt-3 d-none"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Attendance Records Page -->
        <div id="records-page" class="page">
            <div class="card">
                <div class="card-header bg-warning">
                    <h4 class="mb-0"><i class="fas fa-list me-2"></i>考勤记录</h4>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label for="record-date" class="form-label">日期</label>
                            <input type="date" class="form-control" id="record-date">
                        </div>
                        <div class="col-md-3">
                            <label for="record-user" class="form-label">用户</label>
                            <select class="form-select" id="record-user">
                                <option value="">全部用户</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button id="search-records-btn" class="btn btn-warning">
                                <i class="fas fa-search me-2"></i>查询
                            </button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>员工ID</th>
                                    <th>姓名</th>
                                    <th>签到时间</th>
                                    <th>签退时间</th>
                                    <th>置信度</th>
                                    <th>位置</th>
                                </tr>
                            </thead>
                            <tbody id="records-table-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- User Management Page -->
        <div id="users-page" class="page">
            <div class="card">
                <div class="card-header bg-secondary text-white">
                    <h4 class="mb-0"><i class="fas fa-users me-2"></i>用户管理</h4>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>员工ID</th>
                                    <th>姓名</th>
                                    <th>邮箱</th>
                                    <th>部门</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toast-title">通知</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toast-body">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
