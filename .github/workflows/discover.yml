name: Discover jobs
on:
  schedule:
    - cron: '17 1 * * *' # 09:17 Asia/Shanghai; GitHub may delay scheduled runs
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Run mode (write also requires repository variable)
        options: [dry-run, preflight, write]
        default: dry-run
      initialize_columns:
        type: boolean
        description: Add two automation headers to the target tab only
        default: false
  push:
    paths: ['job_discovery/**', 'tests/**', 'config/**', 'requirements*.txt', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: job-discovery-single-writer
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  discover:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover and optionally sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ENABLE_SHEETS_WRITE: ${{ vars.ENABLE_SHEETS_WRITE }}
          REQUESTED_MODE: ${{ inputs.mode }}
          INITIALIZE_COLUMNS: ${{ inputs.initialize_columns }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          mode="${REQUESTED_MODE:-dry-run}"
          if [[ "$EVENT_NAME" == schedule && "$ENABLE_SHEETS_WRITE" == true ]]; then mode=write; fi
          if [[ "$mode" == preflight ]]; then args+=(--sheets); fi
          if [[ "$mode" == write ]]; then args+=(--sheets --write); fi
          if [[ "$INITIALIZE_COLUMNS" == true ]]; then args+=(--initialize-columns); fi
          python -m job_discovery.cli "${args[@]}"
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/*.json
          retention-days: 30
          if-no-files-found: warn
