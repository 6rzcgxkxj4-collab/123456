version: '3.8'

services:
  # TensorFlow Serving - Deep Learning Model Server
  tf-serving:
    image: tensorflow/serving:2.11.0
    container_name: face-recognition-tf-serving
    ports:
      - "8500:8500"  # gRPC port
      - "8501:8501"  # REST API port
    volumes:
      - ./models:/models
    environment:
      - MODEL_NAME=face_recognition
    command: ["--model_config_file=/models/models.config"]
    restart: unless-stopped
    networks:
      - face-recognition-network

  # Backend API Server
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: face-recognition-backend
    ports:
      - "5000:5000"
    environment:
      - TF_SERVING_HOST=tf-serving
      - TF_SERVING_PORT=8501
      - DATABASE_URI=sqlite:///data/attendance.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DEBUG=false
    volumes:
      - ../data:/app/data
      - ../uploads:/app/uploads
      - ../face_images:/app/face_images
    depends_on:
      - tf-serving
    restart: unless-stopped
    networks:
      - face-recognition-network

  # Nginx - Web Server (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: face-recognition-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../src/frontend/static:/usr/share/nginx/html/static:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - face-recognition-network

networks:
  face-recognition-network:
    driver: bridge

volumes:
  data:
